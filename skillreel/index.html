<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillReel</title>
  <meta name="description" content="SkillReel: an agentic system for long video generation. Visual AI Lab, The University of Hong Kong.">
  <style>
    :root { --fg: #1d2330; --muted: #5b6475; --accent: #b5176b; --bg: #fafafa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 640px; padding: 48px 24px; text-align: center; }
    h1 { font-size: 3rem; margin: 0 0 12px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .tagline { font-size: 1.2rem; margin: 0 0 28px; color: var(--fg); }
    .affil { color: var(--muted); margin: 0 0 32px; }
    .soon { display: inline-block; padding: 8px 18px; border: 1px solid #d4d8e0; border-radius: 999px;
            color: var(--muted); font-size: 0.95rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Skill<span>Reel</span></h1>
    <p class="tagline">An agentic system for long video generation</p>
    <p class="affil">Visual AI Lab, The University of Hong Kong</p>
    <span class="soon">Paper, code and demos coming soon</span>
    <footer><a href="https://visual-ai.github.io/">Visual AI Lab</a></footer>
  </main>
</body>
</html>
